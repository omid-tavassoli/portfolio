name: portfolio-admin
services:
  php:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8091:80"
    depends_on:
      - mysql
    volumes:
      - ./src:/var/www/html
      - uploads-data:/var/www/html/uploads

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    env_file: .env
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "127.0.0.1:3307:3306"
  
  phpmyadmin:
    image: phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
    depends_on:
      - mysql
    ports:
      - "127.0.0.1:8092:80"

volumes:
  mysql-data:
  uploads-data: