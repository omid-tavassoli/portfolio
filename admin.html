<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Omid Tavassoli</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#08060f">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2322d3ee'/%3E%3Cstop offset='1' stop-color='%23a855f7'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='%2308060f'/%3E%3Ctext x='32' y='43' font-family='sans-serif' font-size='26' font-weight='bold' text-anchor='middle' fill='url(%23g)'%3EOT%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="css/index.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>
<div id="pre"><div class="pre-ring"><b>OT</b></div></div>
<div id="noise"></div>
<div id="bgfx"><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div></div>
<div id="cdot"></div><div id="cring"></div>

<a class="home-link disp grad-text" href="index.html">OT.</a>

<div id="page">
<main class="auth-shell">
        <div class="glass auth-card rv">
            <div class="auth-tabs">
                <button class="auth-tab active" data-tab="login" type="button">Log In</button>
                <button class="auth-tab" data-tab="signup" type="button">Sign Up</button>
            </div>

            <form id="loginForm" class="auth-form active" novalidate>
                <h1 class="disp auth-title">Welcome back</h1>
                <p class="auth-sub">Sign in to manage the portfolio.</p>
                <div class="auth-msg" id="loginMsg"></div>
                <label class="field">
                    <span class="field-label">Email</span>
                    <input type="email" name="email" placeholder="you@example.com" autocomplete="email" required>
                </label>
                <label class="field">
                    <span class="field-label">Password</span>
                    <input type="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
                </label>
                <button type="submit" class="btn btn-glow auth-submit">Log In</button>
                <p class="auth-switch">No account yet? <a data-tab-link="signup">Sign up</a></p>
            </form>

            <form id="signupForm" class="auth-form" novalidate>
                <h1 class="disp auth-title">Create account</h1>
                <p class="auth-sub">Set up admin access.</p>
                <div class="auth-msg" id="signupMsg"></div>
                <label class="field">
                    <span class="field-label">Name</span>
                    <input type="text" name="name" placeholder="Your name" autocomplete="name" required>
                </label>
                <label class="field">
                    <span class="field-label">Email</span>
                    <input type="email" name="email" placeholder="you@example.com" autocomplete="email" required>
                </label>
                <label class="field">
                    <span class="field-label">Password</span>
                    <input type="password" name="password" placeholder="min. 8 characters" autocomplete="new-password" minlength="8" required>
                </label>
                <label class="field">
                    <span class="field-label">Confirm password</span>
                    <input type="password" name="confirmPassword" placeholder="repeat password" autocomplete="new-password" minlength="8" required>
                </label>
                <button type="submit" class="btn btn-glow auth-submit">Sign Up</button>
                <p class="auth-switch">Already have an account? <a data-tab-link="login">Log in</a></p>
            </form>
        </div>
</main>
</div><!-- /page -->

<script src="js/admin.js"></script>
</body>
</html>
