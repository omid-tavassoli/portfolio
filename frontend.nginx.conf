server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # browsers must ask before reusing a cached file, so edited CSS/JS is never stale
    # (unchanged files still come back as a cheap 304 thanks to the ETag)
    add_header Cache-Control "no-cache" always;

    # the whole repo is mounted as the web root, so only the site's own files are served;
    # everything else (.env, .git, php-backend/, python-backend/, notes) returns 404
    location = / { try_files /index.html =404; }
    location ~ ^/[A-Za-z0-9_-]+\.html$ { }
    location ^~ /css/ { location ~ /\. { return 404; } }
    location ^~ /js/ { location ~ /\. { return 404; } }
    location ^~ /designs/ { location ~ /\. { return 404; } }
    location / { return 404; }
}
